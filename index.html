<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- form: define un formulario para la recogida de datos; action: URL donde se envían los datos; method: método HTTP (GET o POST) para enviar los datos -->
    <form action="index.html" method="get">
        
        <!-- fieldset: agrupa elementos relacionados en un formulario; legend: título o leyenda descriptiva para el fieldset -->
        <fieldset>
            <!-- label: etiqueta descriptiva para un control; for: vincula la etiqueta con el id del control -->
            <legend>Datos personales by Erik</legend>

            <!-- text: tipo de input para una línea de texto libre; placeholder: texto de ayuda dentro del campo; required: indica que el campo es obligatorio; autofocus: enfoca el campo al cargar; size: ancho visible en caracteres; maxlength: número máximo de caracteres permitidos -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">

            <!-- password: tipo de input para contraseñas (oculta los caracteres); minlength: número mínimo de caracteres permitidos -->
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" minlength="8">

            <!-- email: tipo de input optimizado para correos electrónicos con validación automática -->
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>

            <!-- tel: tipo de input para números de teléfono; pattern: expresión regular que debe cumplir el valor -->
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">

            <!-- date: tipo de input para seleccionar una fecha (año, mes y día) -->
            <label for="fnacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fnacimiento" name="fnacimiento">

            <!-- file: tipo de input para adjuntar archivos desde el dispositivo -->
            <label for="foto">Foto:</label>
            <input type="file" id="foto" name="foto">

            <!-- readonly: hace que el campo sea de solo lectura (no editable, pero se envía) -->
            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso" value="2026-27" readonly>

            <!-- disabled: desactiva el campo por completo (no se puede editar ni se envía al servidor) -->
            <label for="centro">Centro:</label>
            <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
        </fieldset>

        <fieldset>
            <legend>Preferencias</legend>

            <!-- radio: tipo de input de opción exclusiva; comparte el mismo name para permitir seleccionar solo una opción del grupo; value: valor que se envía si se selecciona -->
            <label>Turno:</label>
            <label><input type="radio" name="turno" value="maana"> Mañana</label>
            <label><input type="radio" name="turno" value="tarde"> Tarde</label>

            <!-- checkbox: tipo de input de casilla de verificación independiente; permite marcar varias opciones con el mismo name -->
            <label>Intereses:</label>
            <label><input type="checkbox" name="intereses" value="programacion"> Programación</label>
            <label><input type="checkbox" name="intereses" value="diseno"> Diseño</label>
            <label><input type="checkbox" name="intereses" value="redes"> Redes</label>

            <!-- number: tipo de input para introducir valores numéricos; min: valor mínimo permitido; max: valor máximo permitido; step: intervalo de salto entre valores -->
            <label for="horas">Horas de estudio:</label>
            <input type="number" id="horas" name="horas" min="0" max="10" step="2">

            <!-- range: tipo de input que muestra un control deslizante para elegir un valor numérico en un rango -->
            <label for="nivel">Nivel:</label>
            <input type="range" id="nivel" name="nivel" min="1" max="10">

            <!-- color: tipo de input para seleccionar un color mediante un selector gráfico -->
            <label for="color">Color favorito:</label>
            <input type="color" id="color" name="color">

            <!-- time: tipo de input para seleccionar una hora específica (horas y minutos) -->
            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora">

            <!-- week: tipo de input para seleccionar una semana concreta de un año -->
            <label for="semana">Semana:</label>
            <input type="week" id="semana" name="semana">

            <!-- month: tipo de input para seleccionar un mes y un año -->
            <label for="mes">Mes:</label>
            <input type="month" id="mes" name="mes">

            <!-- select: crea un menú desplegable de opciones; multiple: permite seleccionar múltiples opciones a la vez -->
            <!-- optgroup: agrupa opciones en un select; label: título descriptivo del grupo -->
            <!-- option: define una opción dentro de un select; value: valor enviado; selected: marca la opción seleccionada por defecto -->
            <!-- textarea: campo de texto multilínea; rows: número de filas visibles; cols: número de columnas o ancho visible -->
            <label for="modulos">Módulos:</label>
            <select id="modulos" name="modulos" multiple>
                <optgroup label="Primero">
                    <option value="fol" selected>FOL</option>
                    <option value="si">SI</option>
                </optgroup>
                <optgroup label="Segundo">
                    <option value="ei">EI</option>
                </optgroup>
            </select>

            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea>
        </fieldset>

        <!-- submit: botón de tipo input que envía el formulario -->
        <!-- reset: botón de tipo input que limpia/restablece el formulario -->
        <!-- button: botón de tipo input genérico sin acción por defecto -->
        <!-- image: botón de tipo input gráfico basado en imagen; src: ruta de la imagen; alt: texto alternativo de la imagen -->
        <!-- button (etiqueta): elemento contenedor de botón personalizable; type: define su comportamiento (submit, reset o button) -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Restablecer">
        <input type="button" value="Botón genérico">
        <input type="image" src="https://via.placeholder.com/80x30" alt="Botón de imagen" name="btnImagen">

        <button type="submit">Button Submit</button>
        <button type="reset">Button Reset</button>
        <button type="button">Button Genérico</button>
    </form>

    <!-- search: tipo de input optimizado para campos de búsqueda -->
    <!-- list: asocia un input con el id de un datalist de opciones sugeridas -->
    <!-- datalist: contiene un conjunto de elementos option que proporcionan sugerencias automáticas a un input -->
    <form action="https://es.wikipedia.org/w/index.php" method="get">
        <label for="busqueda-wiki">Buscar en Wikipedia:</label>
        <input type="search" id="busqueda-wiki" name="search" list="sugerencias-wiki">
        <datalist id="sugerencias-wiki">
            <option value="Formulario web">
            <option value="HTML">
            <option value="Protocolo de transferencia de hipertexto">
        </datalist>
        <input type="submit" value="Buscar en Wikipedia">
    </form>

    <!-- Formulario OpenStreetMap -->
    <form action="https://www.openstreetmap.org/search" method="get">
        <label for="mapa-ciudad">Elige una ciudad:</label>
        <select id="mapa-ciudad" name="query">
            <optgroup label="Alicante">
                <option value="Elche">Elche</option>
                <option value="Alicante">Alicante</option>
            </optgroup>
            <optgroup label="Valencia">
                <option value="Valencia">Valencia</option>
                <option value="Gandia">Gandia</option>
            </optgroup>
        </select>
        <input type="submit" value="Buscar en Mapa">
    </form>

    <!-- url: tipo de input optimizado para introducir y validar direcciones URL -->
    <form action="https://validator.w3.org/nu/" method="get">
        <label for="url-validador">URL de tu web:</label>
        <input type="url" id="url-validador" name="doc" value="https://tu-usuario.github.io/tu-repositorio/">
        <label>
            <input type="checkbox" name="showsource" value="yes"> Ver el código
        </label>
        <input type="submit" value="Validar">
    </form>

</body>
</html>
